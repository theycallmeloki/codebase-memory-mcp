# Fork release — build this fork's binaries and publish them as a GitHub Release,
# so the tool can be installed from a release URL instead of built locally.
#
# WHY THIS EXISTS, given .github/workflows/release.yml already ships:
# that pipeline is upstream's, and it is not usable from a fork. It runs the
# full gate (lint, test, smoke, soak, CodeQL, VirusTotal-scan of every
# candidate, code-scanning alert counts), it requires a VirusTotal API key, and
# it publishes to npm and PyPI — registries a fork holds no credentials for and
# no permission to write. Anything closer to it than this file is a pipeline
# that fails on the first step that needs a secret.
#
# THE ARTIFACT SHAPE IS NOT OURS TO CHOOSE. install.sh, install.ps1 and the
# binary's own `update` command all resolve a fixed, UNVERSIONED name
# (codebase-memory-mcp-linux-amd64[-portable].tar.gz) and then require a FLAT
# archive holding the binary, LICENSE, install.sh and THIRD_PARTY_NOTICES.md,
# verified against a release-root checksums.txt. An earlier version of this
# workflow invented versioned names, a nested directory, THIRD_PARTY.md and
# per-file .sha256 sidecars, which nothing could install. scripts/
# package-release.sh is the canonical packager that already produces the right
# shape, so this workflow calls it rather than assembling archives by hand.
#
# Linux only. Upstream also ships darwin and windows; add rows to the matrix
# below (and the matching runners) if this fork ever needs them.
#
# THE ALLOCATOR OVERRIDE IS CLEARED BY DEFAULT. On a 2026 gcc/glibc toolchain
# the production build segfaults before main(): the Makefile forces
# -DMI_MALLOC_OVERRIDE=1, so mimalloc serves libc malloc process-wide, and
# libstdc++'s static locale initialiser allocates through newlocale before
# mimalloc's runtime is up — mi_free on an uninitialised heap. The Makefile
# already disables this override permanently on macOS for the same reason. Set
# the `allocator_override` input to true to build upstream's way instead; the
# smoke test below fails the job rather than publishing a binary that cannot
# print its own version.

name: Fork Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release (e.g. v0.1.1-local)"
        required: true
        type: string
      allocator_override:
        description: "Build with upstream's mimalloc global override (may segfault on new toolchains)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            static: false
          # install.sh REQUESTS the -portable name on Linux unconditionally, so
          # this leg is not optional: without it, a Linux install 404s.
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64-portable
            static: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            static: false
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64-portable
            static: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zlib is the one non-toolchain dependency scripts/build.sh needs.
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Resolve version
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${IN_VERSION:-$REF_NAME}"
          case "$V" in
            v*) ;;
            *) echo "::error::version must start with 'v' (got '$V')"; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Upstream's own build entry point — the single source of truth for
      # release binaries, used identically by their CI.
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OVERRIDE: ${{ inputs.allocator_override }}
          STATIC: ${{ matrix.static }}
        run: |
          set -eux
          # ${STATIC:+STATIC=1} would be wrong here: matrix.static arrives as the
          # STRING "false", which is non-empty, so every leg would be built
          # static. Compare explicitly.
          STATIC_ARG=""
          if [ "$STATIC" = "true" ]; then STATIC_ARG="STATIC=1"; fi
          if [ "$OVERRIDE" = "true" ]; then
            scripts/build.sh --version "$VERSION" CC=gcc CXX=g++ $STATIC_ARG
          else
            scripts/build.sh --version "$VERSION" CC=gcc CXX=g++ $STATIC_ARG \
              GLOBAL_OVERRIDE_DEFINE= MIMALLOC_OVERRIDE_DEFINE=
          fi

      # The portable leg exists so the binary runs on any distro. Assert that,
      # rather than trusting the flag.
      - name: Verify static linking
        if: ${{ matrix.static }}
        run: |
          set -eux
          file build/c/codebase-memory-mcp
          ldd build/c/codebase-memory-mcp 2>&1 | grep -qE "not a dynamic executable|statically linked"

      # FAIL LOUDLY RATHER THAN SHIP A BINARY THAT CRASHES ON STARTUP.
      - name: Smoke test
        run: |
          set -eux
          BIN=build/c/codebase-memory-mcp
          test -x "$BIN"
          "$BIN" --version | tee /tmp/version.txt
          grep -q . /tmp/version.txt
          "$BIN" --help > /dev/null

      # The canonical packager owns the archive shape, the naming and the
      # notices file, and it verifies the packaged bytes against this digest.
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eux
          BIN=build/c/codebase-memory-mcp
          SHA="$(sha256sum "$BIN" | cut -d' ' -f1)"
          mkdir -p dist
          VERSION="$VERSION" scripts/package-release.sh "$GOOS" "$GOARCH" \
            --selected-binary "$BIN" \
            --expected-sha256 "$SHA" \
            --out-dir dist
          rm -rf dist/.*.package.lock
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # install.sh and the binary's `update` both download checksums.txt from the
  # release root and verify against it. It has to cover every archive, so it is
  # generated once, after all legs have produced theirs.
  checksums:
    name: checksums.txt
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          set -eux
          cd dist
          rm -f checksums.txt
          # Archives and bundles only: the release also carries this file, and a
          # checksum of itself cannot be self-consistent.
          sha256sum $(ls *.tar.gz *.zip *.mcpb 2>/dev/null) > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-checksums
          path: dist/checksums.txt
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${IN_VERSION:-$REF_NAME}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eux
          ls -la dist
          # -R is REQUIRED here, not decorative: this job only downloads
          # artifacts and never checks the repository out, so there is no .git
          # for gh to infer the repository from. It shells out to git and dies
          # with "fatal: not a git repository" -- which is exactly how the first
          # tag push failed.
          #
          # THE ASSET LIST IS BUILT, NOT GLOBBED. gh resolves its own globs and
          # ERRORS on a pattern that matches nothing ("no matches found for
          # `dist/*.zip`"), so a Linux-only release died on the windows pattern.
          # Collect what actually exists instead; this also keeps the per-
          # platform directories the build legs upload out of the release.
          assets=()
          for f in dist/*.tar.gz dist/*.zip dist/*.mcpb dist/checksums.txt; do
            [ -f "$f" ] && assets+=("$f")
          done
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::no release assets found"; exit 1; }
          printf 'publishing: %s\n' "${assets[@]}"

          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" -R "$GITHUB_REPOSITORY" --clobber
          else
            # --generate-notes, not an empty --notes: a tag push has no workflow
            # input, so the old input-derived string was empty and produced a
            # release with a blank body.
            gh release create "$VERSION" "${assets[@]}" -R "$GITHUB_REPOSITORY" \
              --title "$VERSION" --generate-notes
          fi
